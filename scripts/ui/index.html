<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>羽毛球 AI 剪辑 · Codex Studio</title>
  <link rel="icon" type="image/png" href="/api/icon" />
  <style>
    /* ==========================================================================
       OpenAI Codex "Less is More" Minimalist Design System (Dark & Light)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-app: #0d0d0d;
      --bg-sidebar: #141414;
      --bg-surface: #181818;
      --bg-elevated: #202020;
      --bg-hover: rgba(255, 255, 255, 0.05);
      --bg-active: rgba(16, 163, 127, 0.14);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text-primary: #f0f0f0;
      --text-secondary: #8e8e93;
      --text-muted: #58585e;
      --accent: #10a37f;
      --accent-hover: #0e906f;
      --btn-primary-bg: #f0f0f0;
      --btn-primary-fg: #0d0d0d;
      --btn-sec-bg: rgba(255, 255, 255, 0.06);
      --btn-sec-fg: #e5e5ea;
      --btn-sec-hover: rgba(255, 255, 255, 0.11);
      --danger: #ef4444;
      --amber: #f59e0b;
      --block-off: #2c2c2e;
      --backdrop: rgba(0, 0, 0, 0.65);
    }

    :root[data-theme="light"] {
      --bg-app: #ffffff;
      --bg-sidebar: #f7f7f8;
      --bg-surface: #f2f2f4;
      --bg-elevated: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.04);
      --bg-active: rgba(16, 163, 127, 0.11);
      --border: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.15);
      --text-primary: #111111;
      --text-secondary: #636366;
      --text-muted: #98989d;
      --accent: #10a37f;
      --accent-hover: #0e906f;
      --btn-primary-bg: #111111;
      --btn-primary-fg: #ffffff;
      --btn-sec-bg: rgba(0, 0, 0, 0.05);
      --btn-sec-fg: #1c1c1e;
      --btn-sec-hover: rgba(0, 0, 0, 0.09);
      --danger: #dc2626;
      --amber: #d97706;
      --block-off: #d1d1d6;
      --backdrop: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei UI", sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
      font-variant-numeric: tabular-nums;
    }

    /* ==========================================================================
       Minimalist Top Bar (52px)
       ========================================================================== */
    .topbar {
      height: 52px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--bg-app);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
    }

    .brand-name {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 2px;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ==========================================================================
       Clean Buttons
       ========================================================================== */
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--btn-sec-bg);
      color: var(--btn-sec-fg);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.12s ease;
      white-space: nowrap;
    }

    button:hover {
      background: var(--btn-sec-hover);
    }

    button.btn-primary {
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      font-weight: 600;
    }

    button.btn-primary:hover {
      opacity: 0.9;
    }

    button.btn-accent {
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    button.btn-accent:hover {
      background: var(--accent-hover);
    }

    button.btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      padding: 4px 8px;
    }

    button.btn-ghost:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    button.btn-sm {
      padding: 4px 9px;
      font-size: 11.5px;
      border-radius: 6px;
    }

    /* ==========================================================================
       Main Workspace (Sidebar + Stage)
       ========================================================================== */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Left Sidebar (268px, Calm & Spacious) */
    .sidebar {
      width: 268px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      flex-shrink: 0;
    }

    .sec-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .sec-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      letter-spacing: 0.03em;
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 180px;
      overflow-y: auto;
    }

    .video-row {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.12s ease;
    }

    .video-row:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .video-row.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 600;
    }

    .video-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 155px;
    }

    .video-badge {
      font-size: 11px;
      color: var(--accent);
      font-weight: 500;
    }

    /* Mode Selector Pills (2x3 Clean Grid) */
    .mode-pills {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
    }

    .mode-pill {
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 12px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .mode-pill:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .mode-pill.selected {
      background: var(--bg-active);
      border-color: var(--accent);
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Sidebar Footer Action Area */
    .sidebar-footer {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .status-line {
      font-size: 11.5px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .status-text {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .progress-bar {
      height: 4px;
      background: var(--bg-surface);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }

    .progress-bar.visible {
      display: block;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .cta-main {
      width: 100%;
      height: 38px;
      font-size: 13px;
      border-radius: 9px;
    }

    .cta-sub-row {
      display: flex;
      gap: 6px;
    }

    .cta-sub-row button {
      flex: 1;
    }

    /* ==========================================================================
       Right Main Stage (Cinema Player + Timeline + Clean List)
       ========================================================================== */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 20px 28px;
      gap: 16px;
      overflow: hidden;
    }

    /* 1. Cinema Player Card */
    .player-section {
      flex: 1;
      min-height: 240px;
      display: flex;
      flex-direction: column;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .video-stage {
      flex: 1;
      background: #050505;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      outline: none;
    }

    /* Unified Player Control Bar */
    .player-bar {
      height: 48px;
      padding: 0 16px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .player-left, .player-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rally-indicator {
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .rally-indicator strong {
      color: var(--text-primary);
    }

    .trim-group {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 11.5px;
      color: var(--text-secondary);
      padding-left: 8px;
      border-left: 1px solid var(--border);
    }

    /* 2. Minimalist Timeline Strip */
    .timeline-box {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 12px;
      flex-shrink: 0;
    }

    canvas#timelineCanvas {
      width: 100%;
      height: 36px;
      display: block;
      cursor: pointer;
      border-radius: 6px;
    }

    /* 3. Clean Rally List */
    .list-section {
      height: 215px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .list-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tab-pill {
      padding: 4px 11px;
      border-radius: 99px;
      font-size: 11.5px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      cursor: pointer;
    }

    .tab-pill:hover {
      color: var(--text-primary);
      background: var(--bg-hover);
    }

    .tab-pill.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 600;
    }

    .table-container {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow-y: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    thead th {
      position: sticky;
      top: 0;
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-weight: 500;
      font-size: 11.5px;
      padding: 8px 16px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      z-index: 2;
    }

    tbody tr {
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.1s ease;
    }

    tbody tr:last-child {
      border-bottom: none;
    }

    tbody tr:hover {
      background: var(--bg-hover);
    }

    tbody tr.selected {
      background: var(--bg-active);
    }

    tbody tr.skipped {
      opacity: 0.42;
    }

    tbody td {
      padding: 8px 16px;
    }

    .status-dot {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      padding: 2px 8px;
      border-radius: 99px;
    }

    .status-dot.on {
      color: var(--accent);
      background: rgba(16, 163, 127, 0.12);
    }

    .status-dot.off {
      color: var(--text-secondary);
      background: var(--bg-hover);
    }

    /* ==========================================================================
       Settings Modal (Hidden by Default — Zero Clutter)
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 480px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 20px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 600;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 12.5px;
    }

    .setting-row span.lbl {
      color: var(--text-secondary);
      width: 155px;
    }

    .setting-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .setting-row span.val {
      width: 44px;
      text-align: right;
      color: var(--accent);
      font-weight: 600;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Minimalist Header -->
  <header class="topbar">
    <div class="brand">
      <img src="/api/icon" alt="Icon" class="brand-icon" />
      <span class="brand-name">羽毛球 AI 剪辑</span>
      <span class="brand-sub" id="summarySub">Codex Studio</span>
    </div>

    <div class="topbar-right">
      <button class="btn-ghost btn-sm" onclick="toggleSettings(true)">⚙️ 设置与灵敏度</button>
      <button class="btn-sm" id="themeBtn" onclick="toggleTheme()">☀️ 浅色</button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <div class="layout">
    <!-- Left Sidebar -->
    <aside class="sidebar">
      <!-- 1. Videos -->
      <div>
        <div class="sec-head">
          <span class="sec-label">视频列表</span>
          <div style="display:flex; gap:2px;">
            <button class="btn-ghost btn-sm" onclick="browseNative('files')">＋ 添加</button>
            <button class="btn-ghost btn-sm" onclick="browseNative('folder')">文件夹</button>
          </div>
        </div>
        <div class="video-list" id="videoList"></div>
      </div>

      <!-- 2. Export Modes (Clean Pills) -->
      <div>
        <div class="sec-head">
          <span class="sec-label">输出模式</span>
          <button class="btn-ghost btn-sm" onclick="resetDefaultMode()" style="font-size:11px;">仅默认</button>
        </div>
        <div class="mode-pills" id="modePills"></div>
      </div>

      <!-- 3. Bottom Primary CTA -->
      <div class="sidebar-footer">
        <div class="status-line">
          <span class="status-text" id="statusText">就绪</span>
          <span class="mono" id="pctText"></span>
        </div>
        <div class="progress-bar" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
        </div>

        <button class="btn-primary cta-main" id="mainExportBtn" onclick="startJob('export')">
          导出视频集锦
        </button>

        <div class="cta-sub-row">
          <button class="btn-sm" onclick="startJob('scan')">重新识别</button>
          <button class="btn-sm" onclick="openOutputFolder()">打开输出目录</button>
        </div>
      </div>
    </aside>

    <!-- Right Main Stage -->
    <main class="stage">
      <!-- 1. Single Spacious Cinema Player -->
      <section class="player-section">
        <div class="video-stage">
          <video id="videoPlayer" controls playsinline></video>
        </div>

        <div class="player-bar">
          <div class="player-left">
            <button class="btn-sm" onclick="stepSegment(-1)" title="上一回合 (↑)">⏮</button>
            <button class="btn-accent btn-sm" id="playSegBtn" onclick="playSelectedSegment()">▶ 播放回合</button>
            <button class="btn-sm" onclick="stepSegment(1)" title="下一回合 (↓)">⏭</button>

            <div class="rally-indicator">
              <strong id="curRallyTitle">未选择回合</strong>
              <span class="mono" id="curRallyTime"></span>
            </div>
          </div>

          <div class="player-right">
            <div class="trim-group">
              <span>起点</span>
              <button class="btn-sm" onclick="nudgeEdge('start', -0.5)">-0.5s</button>
              <button class="btn-sm" onclick="nudgeEdge('start', 0.5)">+0.5s</button>
              <button class="btn-sm" onclick="setEdgeToPlayhead('start')" title="将当前播放位置设为本回合起点">设为当前</button>
            </div>
            <div class="trim-group">
              <span>终点</span>
              <button class="btn-sm" onclick="nudgeEdge('end', -0.5)">-0.5s</button>
              <button class="btn-sm" onclick="nudgeEdge('end', 0.5)">+0.5s</button>
              <button class="btn-sm" onclick="setEdgeToPlayhead('end')" title="将当前播放位置设为本回合终点">设为当前</button>
            </div>
            <div class="trim-group">
              <button class="btn-sm" id="keepToggleBtn" onclick="toggleSelectedSegment()">✓ 保留</button>
            </div>
          </div>
        </div>
      </section>

      <!-- 2. Minimalist Timeline -->
      <section class="timeline-box">
        <canvas id="timelineCanvas"></canvas>
      </section>

      <!-- 3. Clean Rally List -->
      <section class="list-section">
        <div class="list-toolbar">
          <div class="filter-tabs" id="gameFilterBar"></div>
          <div style="display:flex; gap:6px;">
            <button class="btn-ghost btn-sm" onclick="batchAction('enable_all')">全部保留</button>
            <button class="btn-ghost btn-sm" onclick="batchAction('keep_15s')">仅留 15s+ 长拍</button>
          </div>
        </div>

        <div class="table-container">
          <table>
            <thead>
              <tr>
                <th style="width:70px;">序号</th>
                <th style="width:90px;">局数</th>
                <th>起止时间</th>
                <th style="width:90px;">时长</th>
                <th style="width:100px; text-align:right;">状态</th>
              </tr>
            </thead>
            <tbody id="segTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Settings & Sensitivity Modal (Hidden by Default) -->
  <div class="modal-backdrop" id="settingsModal" onclick="if(event.target===this) toggleSettings(false)">
    <div class="modal-card">
      <div class="modal-head">
        <span>⚙️ 导出设置与 AI 识别灵敏度</span>
        <button class="btn-ghost btn-sm" onclick="toggleSettings(false)">✕ 关闭</button>
      </div>

      <div>
        <div class="sec-label" style="margin-bottom:6px;">输出文件夹路径</div>
        <div style="display:flex; gap:6px;">
          <input type="text" id="outDirInput" class="mono" onchange="savePrefsFromUI()" />
          <button class="btn-sm" onclick="browseNative('output')">浏览...</button>
        </div>
      </div>

      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <span class="sec-label">AI 多拍识别灵敏度（修改后点“重新识别”生效）</span>
          <button class="btn-ghost btn-sm" onclick="resetSliders()">恢复默认</button>
        </div>

        <div class="setting-row">
          <span class="lbl">最少连续击球拍数</span>
          <input type="range" id="slMinHits" min="3" max="15" step="1" oninput="onSliderInput()" />
          <span class="val mono" id="valMinHits">5拍</span>
        </div>
        <div class="setting-row">
          <span class="lbl">最短有效回合时长</span>
          <input type="range" id="slMinDur" min="3.0" max="18.0" step="0.5" oninput="onSliderInput()" />
          <span class="val mono" id="valMinDur">5.0s</span>
        </div>
        <div class="setting-row">
          <span class="lbl">局间休息切分阈值</span>
          <input type="range" id="slRestGap" min="12.0" max="60.0" step="1.0" oninput="onSliderInput()" />
          <span class="val mono" id="valRestGap">22s</span>
        </div>
        <div class="setting-row">
          <span class="lbl">单局最少有效球数</span>
          <input type="range" id="slMinGameRallies" min="3" max="20" step="1" oninput="onSliderInput()" />
          <span class="val mono" id="valMinGameRallies">8球</span>
        </div>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; padding-top:8px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-secondary);">
        <span class="mono" id="hwInfoText">硬件加速: h264_videotoolbox</span>
        <button class="btn-primary btn-sm" onclick="toggleSettings(false)">完成</button>
      </div>
    </div>
  </div>

  <script>
    const MODES_META = [
      { key: "all",       icon: "🏆", name: "多拍集锦", tip: "默认模式：按局自动切分全部精彩多拍回合" },
      { key: "condensed", icon: "⏱️", name: "纯享紧凑", tip: "剔除所有捡球等待，保留整场紧凑实战" },
      { key: "vertical",  icon: "📱", name: "竖屏 9:16", tip: "居中裁剪生成抖音/小红书 9:16 竖屏集锦" },
      { key: "solo",      icon: "🔥", name: "球员独享", tip: "仅保留锁定组合出场的对局片段" },
      { key: "review",    icon: "⚡", name: "发球复盘", tip: "筛选 3~6 秒内一拍定音与接发秒杀回合" },
      { key: "showcase",  icon: "🎬", name: "高光集锦", tip: "精选全天最长 Top 5 魔鬼多拍 + 慢镜重放" },
    ];

    let appState = null;
    let selectedModes = ["all"];
    let selectedSegIdx = 0;
    let activeGameFilter = "all";
    let loadedVideoPath = null;
    let isLoopingSegment = false;
    let dragMode = null;

    const videoEl = document.getElementById("videoPlayer");
    const canvas = document.getElementById("timelineCanvas");
    const ctx = canvas.getContext("2d");

    async function apiGet(url) {
      const r = await fetch(url);
      return await r.json();
    }

    async function apiPost(url, payload = {}) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return await r.json();
    }

    function fmtSec(sec) {
      sec = Math.max(0, Number(sec) || 0);
      const m = Math.floor(sec / 60);
      const s = sec - m * 60;
      return `${String(m).padStart(2, "0")}:${s.toFixed(1).padStart(4, "0")}`;
    }

    function renderAll(state, preserveSelection = true) {
      appState = state;

      // Theme
      const theme = state.theme_mode === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("themeBtn").textContent = theme === "dark" ? "☀️ 浅色" : "🌙 深色";
      document.getElementById("hwInfoText").textContent = `硬件加速: ${state.hw_encoder} · v${state.version}`;

      // Videos list
      const vList = document.getElementById("videoList");
      vList.innerHTML = "";
      (state.videos || []).forEach((v) => {
        const div = document.createElement("div");
        div.className = "video-row" + (v.path === state.current_vpath ? " active" : "");
        div.onclick = () => selectVideo(v.path);
        div.innerHTML = `
          <span class="video-name" title="${v.path}">${v.name}</span>
          <span class="video-badge mono">${v.cached ? v.rally_count + " 拍" : "待识别"}</span>
        `;
        vList.appendChild(div);
      });

      // Modes pills
      const mPills = document.getElementById("modePills");
      mPills.innerHTML = "";
      MODES_META.forEach((m) => {
        const selected = selectedModes.includes(m.key);
        const btn = document.createElement("button");
        btn.className = "mode-pill" + (selected ? " selected" : "");
        btn.title = m.tip;
        btn.onclick = () => toggleModePill(m.key);
        btn.innerHTML = `<span>${m.icon}</span><span>${m.name}</span>`;
        mPills.appendChild(btn);
      });

      // Settings Modal inputs
      if (document.activeElement !== document.getElementById("outDirInput")) {
        document.getElementById("outDirInput").value = state.output_dir || "";
      }

      // Progress & Status
      const job = state.job || {};
      const pBar = document.getElementById("progressBar");
      const mainBtn = document.getElementById("mainExportBtn");
      if (job.is_running) {
        pBar.classList.add("visible");
        const pct = Math.round(job.progress || 0);
        document.getElementById("progressFill").style.width = `${pct}%`;
        document.getElementById("pctText").textContent = `${pct}%`;
        document.getElementById("statusText").textContent = job.status || "正在处理...";
        mainBtn.textContent = "⏹ 停止任务";
        mainBtn.onclick = () => apiPost("/api/stop_job").then(s => renderAll(s, true));
      } else {
        pBar.classList.remove("visible");
        document.getElementById("pctText").textContent = "";
        mainBtn.textContent = "导出视频集锦";
        mainBtn.onclick = () => startJob("one_click");
      }

      // Timeline & Segments
      const tl = state.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) {
        document.getElementById("summarySub").textContent = "未加载时间轴";
        if (!job.is_running) {
          document.getElementById("statusText").textContent = "点击「重新识别」或「导出视频集锦」开始";
        }
        document.getElementById("segTableBody").innerHTML = `
          <tr><td colspan="5" style="text-align:center; padding:32px; color:var(--text-secondary);">
            当前视频尚未识别回合，请点击左下角「重新识别」或「导出视频集锦」
          </td></tr>`;
        drawTimeline();
        return;
      }

      if (!preserveSelection || selectedSegIdx >= tl.segments.length) {
        selectedSegIdx = 0;
      }

      const enabledSegs = tl.segments.filter(s => s.enabled);
      const totalKeptDur = enabledSegs.reduce((a, b) => a + (b.e_cut - b.s_cut), 0);
      document.getElementById("summarySub").textContent =
        `保留 ${enabledSegs.length}/${tl.segments.length} 拍 · 共 ${fmtSec(totalKeptDur)}`;
      if (!job.is_running) {
        document.getElementById("statusText").textContent =
          `已就绪 · ${enabledSegs.length} 个精彩多拍回合`;
      }

      // Load video source if switched
      if (loadedVideoPath !== tl.video_path) {
        loadedVideoPath = tl.video_path;
        videoEl.src = `/api/video?path=${encodeURIComponent(tl.video_path)}`;
        const seg0 = tl.segments[selectedSegIdx];
        if (seg0) {
          videoEl.currentTime = seg0.s_cut;
        }
      }

      renderGameFilters(tl);
      renderSegmentTable(tl);
      updateSelectedSegmentUI();
      drawTimeline();
    }

    function renderGameFilters(tl) {
      const bar = document.getElementById("gameFilterBar");
      const segs = tl.segments || [];
      const games = {};
      segs.forEach(s => {
        const g = s.game_idx || 1;
        games[g] = (games[g] || 0) + 1;
      });
      const longCount = segs.filter(s => (s.e_cut - s.s_cut) >= 15.0).length;

      const items = [{ id: "all", label: `全部 (${segs.length})` }];
      Object.keys(games).sort((a, b) => Number(a) - Number(b)).forEach(g => {
        items.push({ id: `g${g}`, label: `第 ${g} 局 (${games[g]})` });
      });
      items.push({ id: "long15", label: `15s+ 超长拍 (${longCount})` });

      bar.innerHTML = "";
      items.forEach(it => {
        const b = document.createElement("button");
        b.className = "tab-pill" + (activeGameFilter === it.id ? " active" : "");
        b.textContent = it.label;
        b.onclick = () => {
          activeGameFilter = it.id;
          renderGameFilters(tl);
          renderSegmentTable(tl);
          drawTimeline();
        };
        bar.appendChild(b);
      });
    }

    function passesFilter(seg) {
      if (activeGameFilter === "all") return true;
      if (activeGameFilter === "long15") return (seg.e_cut - seg.s_cut) >= 15.0;
      if (activeGameFilter.startsWith("g")) {
        return (seg.game_idx || 1) === Number(activeGameFilter.slice(1));
      }
      return true;
    }

    function renderSegmentTable(tl) {
      const tbody = document.getElementById("segTableBody");
      tbody.innerHTML = "";
      (tl.segments || []).forEach((s, idx) => {
        if (!passesFilter(s)) return;
        const tr = document.createElement("tr");
        if (idx === selectedSegIdx) tr.classList.add("selected");
        if (!s.enabled) tr.classList.add("skipped");

        const dur = (s.e_cut - s.s_cut).toFixed(1);
        tr.onclick = () => selectSegment(idx, false);
        tr.ondblclick = () => toggleSegmentAtIndex(idx);

        tr.innerHTML = `
          <td class="mono" style="color:var(--text-secondary);">#${String(s.uid).padStart(2, "0")}</td>
          <td>第 ${s.game_idx || 1} 局</td>
          <td class="mono">${fmtSec(s.s_cut)} — ${fmtSec(s.e_cut)}</td>
          <td class="mono" style="font-weight:600;">${dur}s</td>
          <td style="text-align:right;">
            <span class="status-dot ${s.enabled ? 'on' : 'off'}" onclick="event.stopPropagation(); toggleSegmentAtIndex(${idx})">
              ${s.enabled ? "● 保留" : "○ 跳过"}
            </span>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateSelectedSegmentUI() {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const dur = (seg.e_cut - seg.s_cut).toFixed(1);

      videoEl.poster = `/api/frame?path=${encodeURIComponent(tl.video_path)}&t=${(seg.s_cut + 0.5).toFixed(2)}`;

      document.getElementById("curRallyTitle").textContent =
        `第 ${seg.game_idx || 1} 局 · #${String(seg.uid).padStart(2, "0")}`;
      document.getElementById("curRallyTime").textContent =
        `${fmtSec(seg.s_cut)} → ${fmtSec(seg.e_cut)} (${dur}s)`;

      const keepBtn = document.getElementById("keepToggleBtn");
      if (seg.enabled) {
        keepBtn.textContent = "✓ 保留本拍";
        keepBtn.style.color = "var(--accent)";
      } else {
        keepBtn.textContent = "✕ 已跳过";
        keepBtn.style.color = "var(--text-secondary)";
      }
    }

    function selectSegment(idx, autoPlay = true) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || idx < 0 || idx >= tl.segments.length) return;
      selectedSegIdx = idx;
      const seg = tl.segments[idx];
      updateSelectedSegmentUI();
      renderSegmentTable(tl);
      drawTimeline();

      const rows = document.querySelectorAll("#segTableBody tr.selected");
      if (rows.length > 0) rows[0].scrollIntoView({ block: "nearest" });

      videoEl.currentTime = seg.s_cut;
      if (autoPlay) {
        isLoopingSegment = true;
        videoEl.play().catch(() => {});
      }
    }

    function stepSegment(delta) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments) return;
      const next = Math.max(0, Math.min(tl.segments.length - 1, selectedSegIdx + delta));
      selectSegment(next, true);
    }

    function playSelectedSegment() {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      if (!videoEl.paused) {
        videoEl.pause();
        return;
      }
      if (videoEl.currentTime < seg.s_cut || videoEl.currentTime >= seg.e_cut - 0.15) {
        videoEl.currentTime = seg.s_cut;
      }
      isLoopingSegment = true;
      videoEl.play().catch(() => {});
    }

    videoEl.addEventListener("play", () => {
      document.getElementById("playSegBtn").textContent = "⏸ 暂停";
    });

    videoEl.addEventListener("pause", () => {
      document.getElementById("playSegBtn").textContent = "▶ 播放回合";
    });

    videoEl.addEventListener("timeupdate", () => {
      const tl = appState?.timeline;
      if (tl && tl.segments && tl.segments[selectedSegIdx] && isLoopingSegment) {
        const seg = tl.segments[selectedSegIdx];
        if (videoEl.currentTime >= seg.e_cut) {
          videoEl.pause();
          isLoopingSegment = false;
        }
      }
      drawTimeline();
    });

    // ==========================================================================
    // Minimalist Interactive Timeline Canvas
    // ==========================================================================
    function drawTimeline() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.save();
      ctx.scale(dpr, dpr);

      const W = rect.width;
      const H = rect.height;
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";

      ctx.fillStyle = isDark ? "#121212" : "#ececee";
      ctx.beginPath();
      ctx.roundRect(0, 0, W, H, 6);
      ctx.fill();

      const tl = appState?.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) {
        ctx.restore();
        return;
      }

      const dur = Math.max(tl.duration || 1, 1);
      const padX = 8;
      const trackW = W - padX * 2;

      tl.segments.forEach((s, i) => {
        const x1 = padX + (s.s_cut / dur) * trackW;
        const x2 = Math.max(x1 + 2.5, padX + (s.e_cut / dur) * trackW);
        const inFilter = passesFilter(s);

        if (i === selectedSegIdx) {
          ctx.fillStyle = "#f59e0b";
        } else if (!s.enabled) {
          ctx.fillStyle = isDark ? "#2c2c2e" : "#d1d1d6";
        } else {
          ctx.fillStyle = inFilter ? "#10a37f" : "rgba(16,163,127,0.28)";
        }

        const y = i === selectedSegIdx ? 4 : 7;
        const h = i === selectedSegIdx ? H - 8 : H - 14;
        ctx.beginPath();
        ctx.roundRect(x1, y, x2 - x1, h, 3);
        ctx.fill();
      });

      // Playhead line
      const curT = videoEl.currentTime || 0;
      const px = padX + (curT / dur) * trackW;
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px, 2);
      ctx.lineTo(px, H - 2);
      ctx.stroke();

      ctx.restore();
    }

    window.addEventListener("resize", drawTimeline);

    canvas.addEventListener("mousedown", (e) => {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const padX = 8;
      const trackW = rect.width - padX * 2;
      const dur = Math.max(tl.duration || 1, 1);

      const sel = tl.segments[selectedSegIdx];
      if (sel) {
        const sx1 = padX + (sel.s_cut / dur) * trackW;
        const sx2 = padX + (sel.e_cut / dur) * trackW;
        if (Math.abs(mx - sx1) <= 6) { dragMode = "start"; return; }
        if (Math.abs(mx - sx2) <= 6) { dragMode = "end"; return; }
      }

      for (let i = 0; i < tl.segments.length; i++) {
        const s = tl.segments[i];
        const x1 = padX + (s.s_cut / dur) * trackW;
        const x2 = Math.max(x1 + 3, padX + (s.e_cut / dur) * trackW);
        if (mx >= x1 - 2 && mx <= x2 + 2) {
          selectSegment(i, true);
          return;
        }
      }

      const clickT = Math.max(0, Math.min(dur, ((mx - padX) / trackW) * dur));
      videoEl.currentTime = clickT;
      drawTimeline();
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragMode) return;
      const tl = appState?.timeline;
      if (!tl) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const padX = 8;
      const trackW = rect.width - padX * 2;
      const dur = Math.max(tl.duration || 1, 1);
      const t = Math.max(0, Math.min(dur, ((mx - padX) / trackW) * dur));
      const seg = tl.segments[selectedSegIdx];
      if (dragMode === "start" && t < seg.e_cut - 1.0) {
        seg.s_cut = Math.round(t * 10) / 10;
        videoEl.currentTime = seg.s_cut;
      } else if (dragMode === "end" && t > seg.s_cut + 1.0) {
        seg.e_cut = Math.round(t * 10) / 10;
        videoEl.currentTime = seg.e_cut;
      }
      updateSelectedSegmentUI();
      drawTimeline();
    });

    window.addEventListener("mouseup", async () => {
      if (!dragMode) return;
      dragMode = null;
      const tl = appState?.timeline;
      if (tl && tl.segments[selectedSegIdx]) {
        const seg = tl.segments[selectedSegIdx];
        const st = await apiPost("/api/update_segment", {
          uid: seg.uid,
          action: "set_time",
          s_cut: seg.s_cut,
          e_cut: seg.e_cut,
        });
        renderAll(st, true);
      }
    });

    // ==========================================================================
    // Actions & API Calls
    // ==========================================================================
    async function selectVideo(path) {
      const st = await apiPost("/api/select_video", { path });
      renderAll(st, false);
    }

    async function browseNative(kind) {
      const st = await apiPost("/api/browse", { kind });
      renderAll(st, true);
    }

    function toggleModePill(key) {
      const cur = new Set(selectedModes);
      if (cur.has(key)) {
        if (cur.size > 1) cur.delete(key);
      } else {
        cur.add(key);
      }
      selectedModes = Array.from(cur);
      renderAll(appState, true);
    }

    function resetDefaultMode() {
      selectedModes = ["all"];
      renderAll(appState, true);
    }

    function toggleSettings(open) {
      document.getElementById("settingsModal").classList.toggle("open", open);
    }

    function onSliderInput() {
      document.getElementById("valMinHits").textContent = `${document.getElementById("slMinHits").value}拍`;
      document.getElementById("valMinDur").textContent = `${Number(document.getElementById("slMinDur").value).toFixed(1)}s`;
      document.getElementById("valRestGap").textContent = `${Number(document.getElementById("slRestGap").value).toFixed(0)}s`;
      document.getElementById("valMinGameRallies").textContent = `${document.getElementById("slMinGameRallies").value}球`;
    }

    async function savePrefsFromUI() {
      const st = await apiPost("/api/save_prefs", {
        output_dir: document.getElementById("outDirInput").value,
      });
      renderAll(st, true);
    }

    function resetSliders() {
      document.getElementById("slMinHits").value = 5;
      document.getElementById("slMinDur").value = 5.0;
      document.getElementById("slRestGap").value = 22.0;
      document.getElementById("slMinGameRallies").value = 8;
      onSliderInput();
    }

    async function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      drawTimeline();
      const st = await apiPost("/api/save_prefs", { theme_mode: next });
      renderAll(st, true);
    }

    async function nudgeEdge(which, delta) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const payload = {
        uid: seg.uid,
        action: "adjust_time",
        delta_start: which === "start" ? delta : 0.0,
        delta_end: which === "end" ? delta : 0.0,
      };
      const st = await apiPost("/api/update_segment", payload);
      renderAll(st, true);
      const updatedSeg = st.timeline?.segments?.[selectedSegIdx];
      if (updatedSeg) {
        videoEl.currentTime = which === "start" ? updatedSeg.s_cut : Math.max(updatedSeg.s_cut, updatedSeg.e_cut - 0.8);
      }
    }

    async function setEdgeToPlayhead(which) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const cur = videoEl.currentTime || 0;
      let ns = seg.s_cut;
      let ne = seg.e_cut;
      if (which === "start" && cur < ne - 0.8) ns = cur;
      if (which === "end" && cur > ns + 0.8) ne = cur;
      const st = await apiPost("/api/update_segment", {
        uid: seg.uid,
        action: "set_time",
        s_cut: ns,
        e_cut: ne,
      });
      renderAll(st, true);
    }

    async function toggleSelectedSegment() {
      await toggleSegmentAtIndex(selectedSegIdx);
    }

    async function toggleSegmentAtIndex(idx) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[idx]) return;
      const st = await apiPost("/api/update_segment", {
        uid: tl.segments[idx].uid,
        action: "toggle",
      });
      renderAll(st, true);
    }

    async function batchAction(action) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments) return;
      for (const s of tl.segments) {
        const shouldKeep = action === "enable_all" ? true : (s.e_cut - s.s_cut >= 15.0);
        if (s.enabled !== shouldKeep) {
          await apiPost("/api/update_segment", { uid: s.uid, action: "toggle" });
        }
      }
      const st = await apiGet("/api/state");
      renderAll(st, true);
    }

    async function startJob(kind) {
      const jobType = kind === "scan" ? "force_rescan" : "one_click";
      const st = await apiPost("/api/start_job", {
        job_type: jobType,
        config: {
          output_dir: document.getElementById("outDirInput").value,
          modes: selectedModes,
          min_hits: Number(document.getElementById("slMinHits").value || 5),
          min_duration: Number(document.getElementById("slMinDur").value || 5.0),
          rest_gap: Number(document.getElementById("slRestGap").value || 22.0),
          min_rallies_per_game: Number(document.getElementById("slMinGameRallies").value || 8),
        },
      });
      renderAll(st, true);
    }

    async function openOutputFolder() {
      await apiPost("/api/open_folder", {});
    }

    // Keyboard shortcuts (Space: play/pause, Up/Down: prev/next rally, Backspace: toggle keep)
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        playSelectedSegment();
      } else if (e.code === "ArrowUp") {
        e.preventDefault();
        stepSegment(-1);
      } else if (e.code === "ArrowDown") {
        e.preventDefault();
        stepSegment(1);
      } else if (e.code === "Backspace" || e.code === "Delete") {
        e.preventDefault();
        toggleSelectedSegment();
      }
    });

    // Initial load & gentle background polling when job is active
    (async function init() {
      resetSliders();
      const st = await apiGet("/api/state");
      renderAll(st, false);
      setInterval(async () => {
        if (appState && appState.job && appState.job.is_running) {
          const updated = await apiGet("/api/state");
          renderAll(updated, true);
        }
      }, 650);
    })();
  </script>
</body>
</html>
