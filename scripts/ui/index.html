<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Badminton Studio</title>
  <link rel="icon" type="image/png" href="/api/icon" />
  <style>
    /* ==========================================================================
       OpenAI Codex / Linear Unified Flat Icon Design System (Dark & Light)
       ========================================================================== */
    :root[data-theme="dark"] {
      --bg-app: #0c0c0e;
      --bg-sidebar: #121215;
      --bg-surface: #17171b;
      --bg-elevated: #1f1f24;
      --bg-hover: rgba(255, 255, 255, 0.06);
      --bg-active: rgba(16, 163, 127, 0.16);
      --border: rgba(255, 255, 255, 0.07);
      --border-strong: rgba(255, 255, 255, 0.15);
      --text-primary: #f2f2f5;
      --text-secondary: #8a8a93;
      --text-muted: #52525b;
      --accent: #10a37f;
      --accent-hover: #0d8c6c;
      --btn-primary-bg: #f2f2f5;
      --btn-primary-fg: #0c0c0e;
      --btn-sec-bg: rgba(255, 255, 255, 0.05);
      --btn-sec-fg: #d4d4d8;
      --btn-sec-hover: rgba(255, 255, 255, 0.1);
      --amber: #f59e0b;
      --danger: #ef4444;
      --backdrop: rgba(0, 0, 0, 0.65);
    }

    :root[data-theme="light"] {
      --bg-app: #ffffff;
      --bg-sidebar: #f6f6f8;
      --bg-surface: #f0f0f3;
      --bg-elevated: #ffffff;
      --bg-hover: rgba(0, 0, 0, 0.05);
      --bg-active: rgba(16, 163, 127, 0.13);
      --border: rgba(0, 0, 0, 0.07);
      --border-strong: rgba(0, 0, 0, 0.15);
      --text-primary: #121215;
      --text-secondary: #686870;
      --text-muted: #a1a1aa;
      --accent: #10a37f;
      --accent-hover: #0d8c6c;
      --btn-primary-bg: #121215;
      --btn-primary-fg: #ffffff;
      --btn-sec-bg: rgba(0, 0, 0, 0.045);
      --btn-sec-fg: #27272a;
      --btn-sec-hover: rgba(0, 0, 0, 0.09);
      --amber: #d97706;
      --danger: #dc2626;
      --backdrop: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "PingFang SC", sans-serif;
      background: var(--bg-app);
      color: var(--text-primary);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .mono {
      font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace;
      font-variant-numeric: tabular-nums;
    }

    /* Unified Flat SVG Icon Styling */
    svg.flat-icon {
      width: 17px;
      height: 17px;
      stroke: currentColor;
      stroke-width: 1.85;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
      flex-shrink: 0;
    }

    svg.flat-icon.lg {
      width: 20px;
      height: 20px;
    }

    svg.flat-icon.sm {
      width: 14px;
      height: 14px;
    }

    /* ==========================================================================
       Minimalist Icon Topbar (48px)
       ========================================================================== */
    .topbar {
      height: 48px;
      padding: 0 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      object-fit: cover;
    }

    .stat-pills {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 9px;
      border-radius: 99px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .stat-pill strong {
      color: var(--text-primary);
      font-weight: 600;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ==========================================================================
       Flat Icon Buttons
       ========================================================================== */
    button {
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid transparent;
      background: var(--btn-sec-bg);
      color: var(--btn-sec-fg);
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.12s ease;
    }

    button:hover {
      background: var(--btn-sec-hover);
      color: var(--text-primary);
    }

    .icon-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border-radius: 8px;
    }

    .icon-btn.sm {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }

    .icon-btn.accent {
      background: var(--accent);
      color: #ffffff;
    }

    .icon-btn.accent:hover {
      background: var(--accent-hover);
    }

    .icon-btn.active-keep {
      background: rgba(16, 163, 127, 0.16);
      color: var(--accent);
      border-color: rgba(16, 163, 127, 0.35);
    }

    .icon-btn.skipped-keep {
      background: var(--btn-sec-bg);
      color: var(--text-muted);
    }

    /* ==========================================================================
       Main Split Layout
       ========================================================================== */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Slim Icon-Driven Sidebar (224px) */
    .sidebar {
      width: 224px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      flex-shrink: 0;
    }

    .sec-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .video-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-height: 190px;
      overflow-y: auto;
    }

    .video-item {
      padding: 7px 9px;
      border-radius: 8px;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.12s ease;
    }

    .video-item:hover {
      background: var(--bg-hover);
      color: var(--text-primary);
    }

    .video-item.active {
      background: var(--bg-active);
      color: var(--text-primary);
      font-weight: 600;
    }

    .video-item-left {
      display: flex;
      align-items: center;
      gap: 7px;
      min-width: 0;
    }

    .video-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .video-cnt {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
    }

    /* 3x2 Flat Icon Mode Grid */
    .mode-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .mode-tile {
      height: 54px;
      border-radius: 10px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all 0.12s ease;
      padding: 4px;
    }

    .mode-tile span {
      font-size: 10.5px;
      font-weight: 500;
    }

    .mode-tile:hover {
      border-color: var(--border-strong);
      color: var(--text-primary);
    }

    .mode-tile.selected {
      background: var(--bg-active);
      border-color: var(--accent);
      color: var(--accent);
    }

    .mode-tile.selected span {
      color: var(--text-primary);
      font-weight: 600;
    }

    /* Sidebar Bottom Action Dock */
    .sidebar-dock {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }

    .progress-wrap {
      height: 4px;
      background: var(--bg-surface);
      border-radius: 99px;
      overflow: hidden;
      display: none;
    }

    .progress-wrap.visible {
      display: block;
    }

    .progress-bar {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.2s ease;
    }

    .dock-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-export-main {
      flex: 1;
      height: 36px;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
      border-radius: 9px;
      font-weight: 600;
      font-size: 12.5px;
    }

    .btn-export-main:hover {
      opacity: 0.92;
      background: var(--btn-primary-bg);
      color: var(--btn-primary-fg);
    }

    /* ==========================================================================
       Right Main Stage (Cinema Player + Timeline + Visual Chip Grid)
       ========================================================================== */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 16px 22px;
      gap: 12px;
      overflow: hidden;
    }

    /* 1. Cinema Video Card */
    .player-card {
      flex: 1;
      min-height: 240px;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .video-viewport {
      flex: 1;
      background: #050507;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      outline: none;
    }

    /* Pure Icon Transport Bar */
    .transport-bar {
      height: 44px;
      padding: 0 14px;
      background: var(--bg-elevated);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .transport-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .time-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 4px 10px;
      border-radius: 7px;
      background: var(--bg-surface);
      font-size: 12px;
      color: var(--text-secondary);
      margin-left: 4px;
    }

    .time-pill strong {
      color: var(--text-primary);
    }

    .divider-v {
      width: 1px;
      height: 16px;
      background: var(--border-strong);
      margin: 0 4px;
    }

    /* 2. Minimalist Timeline Bar */
    .timeline-strip {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      flex-shrink: 0;
    }

    canvas#timelineCanvas {
      width: 100%;
      height: 32px;
      display: block;
      cursor: pointer;
      border-radius: 5px;
    }

    /* 3. Visual Rally Chip Matrix (Replaces wordy text table!) */
    .chips-section {
      height: 168px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .chips-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .filter-group {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .filter-pill {
      padding: 4px 10px;
      border-radius: 99px;
      font-size: 11.5px;
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .filter-pill.active {
      background: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-strong);
      font-weight: 600;
    }

    .chips-grid {
      flex: 1;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
      grid-auto-rows: 34px;
      gap: 6px;
      align-content: start;
    }

    .rally-chip {
      height: 34px;
      padding: 0 9px;
      border-radius: 8px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      font-size: 11.5px;
      transition: all 0.1s ease;
    }

    .rally-chip:hover {
      border-color: var(--border-strong);
    }

    .rally-chip.selected {
      background: var(--bg-active);
      border-color: var(--amber);
    }

    .rally-chip.skipped {
      opacity: 0.35;
    }

    .chip-id {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .rally-chip.selected .chip-id {
      color: var(--amber);
    }

    .chip-dur {
      color: var(--text-primary);
      font-weight: 600;
    }

    .chip-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .rally-chip.skipped .chip-dot {
      background: var(--text-muted);
    }

    /* ==========================================================================
       Minimalist Settings Modal
       ========================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: var(--backdrop);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      width: 420px;
      background: var(--bg-elevated);
      border: 1px solid var(--border-strong);
      border-radius: 14px;
      padding: 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13.5px;
      font-weight: 600;
    }

    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .slider-row span.lbl {
      width: 110px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .slider-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .slider-row span.val {
      width: 40px;
      text-align: right;
      color: var(--accent);
      font-weight: 600;
    }

    input[type="text"] {
      flex: 1;
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1px solid var(--border-strong);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 11.5px;
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Reusable Unified Flat SVG Icon Definitions -->
  <svg style="display:none;" xmlns="http://www.w3.org/2000/svg">
    <!-- Shuttlecock / Rally -->
    <symbol id="ic-shuttle" viewBox="0 0 24 24">
      <path d="M12 19a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z"/>
      <path d="M9.5 14.5 5 4l5 3 2-4 2 4 5-3-4.5 10.5"/>
    </symbol>
    <!-- Fast Forward / Condensed -->
    <symbol id="ic-bolt" viewBox="0 0 24 24">
      <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
    </symbol>
    <!-- Vertical 9:16 Smartphone -->
    <symbol id="ic-phone" viewBox="0 0 24 24">
      <rect x="6" y="2" width="12" height="20" rx="2.5"/>
      <line x1="10" y1="18" x2="14" y2="18"/>
    </symbol>
    <!-- Solo Player Focus -->
    <symbol id="ic-user" viewBox="0 0 24 24">
      <circle cx="12" cy="8" r="4"/>
      <path d="M5 20a7 7 0 0 1 14 0"/>
    </symbol>
    <!-- Serve Kill / Target Crosshair -->
    <symbol id="ic-target" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <circle cx="12" cy="12" r="3"/>
      <line x1="12" y1="3" x2="12" y2="6"/>
      <line x1="12" y1="18" x2="12" y2="21"/>
      <line x1="3" y1="12" x2="6" y2="12"/>
      <line x1="18" y1="12" x2="21" y2="12"/>
    </symbol>
    <!-- Top 5 Showcase Sparkles -->
    <symbol id="ic-star" viewBox="0 0 24 24">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </symbol>
    <!-- Video File -->
    <symbol id="ic-video" viewBox="0 0 24 24">
      <rect x="2" y="4" width="15" height="16" rx="2.5"/>
      <polygon points="17 9 22 6 22 18 17 15 17 9"/>
    </symbol>
    <!-- Add Plus -->
    <symbol id="ic-plus" viewBox="0 0 24 24">
      <line x1="12" y1="5" x2="12" y2="19"/>
      <line x1="5" y1="12" x2="19" y2="12"/>
    </symbol>
    <!-- Folder -->
    <symbol id="ic-folder" viewBox="0 0 24 24">
      <path d="M3 6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z"/>
    </symbol>
    <!-- External Folder Open -->
    <symbol id="ic-folder-open" viewBox="0 0 24 24">
      <path d="M2 19a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v14Z"/>
    </symbol>
    <!-- Refresh / Rescan -->
    <symbol id="ic-refresh" viewBox="0 0 24 24">
      <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
      <path d="M3 3v5h5"/>
      <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
      <path d="M16 16h5v5"/>
    </symbol>
    <!-- Export / Download -->
    <symbol id="ic-export" viewBox="0 0 24 24">
      <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
      <polyline points="7 10 12 15 17 10"/>
      <line x1="12" y1="15" x2="12" y2="3"/>
    </symbol>
    <!-- Stop Square -->
    <symbol id="ic-stop" viewBox="0 0 24 24">
      <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>
    </symbol>
    <!-- Play -->
    <symbol id="ic-play" viewBox="0 0 24 24">
      <polygon points="6 4 20 12 6 20 6 4" fill="currentColor"/>
    </symbol>
    <!-- Pause -->
    <symbol id="ic-pause" viewBox="0 0 24 24">
      <rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/>
      <rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>
    </symbol>
    <!-- Prev -->
    <symbol id="ic-prev" viewBox="0 0 24 24">
      <polygon points="19 20 9 12 19 4 19 20"/>
      <line x1="5" y1="19" x2="5" y2="5"/>
    </symbol>
    <!-- Next -->
    <symbol id="ic-next" viewBox="0 0 24 24">
      <polygon points="5 4 15 12 5 20 5 4"/>
      <line x1="19" y1="5" x2="19" y2="19"/>
    </symbol>
    <!-- Bracket In [| -->
    <symbol id="ic-in" viewBox="0 0 24 24">
      <path d="M9 4H5v16h4"/>
      <line x1="15" y1="12" x2="21" y2="12"/>
      <polyline points="18 9 15 12 18 15"/>
    </symbol>
    <!-- Bracket Out |] -->
    <symbol id="ic-out" viewBox="0 0 24 24">
      <path d="M15 4h4v16h-4"/>
      <line x1="3" y1="12" x2="9" y2="12"/>
      <polyline points="6 9 9 12 6 15"/>
    </symbol>
    <!-- Check / Keep -->
    <symbol id="ic-check" viewBox="0 0 24 24">
      <polyline points="20 6 9 17 4 12"/>
    </symbol>
    <!-- Sliders / Settings -->
    <symbol id="ic-sliders" viewBox="0 0 24 24">
      <line x1="4" y1="21" x2="4" y2="14"/>
      <line x1="4" y1="10" x2="4" y2="3"/>
      <line x1="12" y1="21" x2="12" y2="12"/>
      <line x1="12" y1="8" x2="12" y2="3"/>
      <line x1="20" y1="21" x2="20" y2="16"/>
      <line x1="20" y1="12" x2="20" y2="3"/>
      <line x1="1" y1="14" x2="7" y2="14"/>
      <line x1="9" y1="8" x2="15" y2="8"/>
      <line x1="17" y1="16" x2="23" y2="16"/>
    </symbol>
    <!-- Sun (Light Mode) -->
    <symbol id="ic-sun" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="2" x2="12" y2="4"/>
      <line x1="12" y1="20" x2="12" y2="22"/>
      <line x1="4.93" y1="4.93" x2="6.34" y2="6.34"/>
      <line x1="17.66" y1="17.66" x2="19.07" y2="19.07"/>
      <line x1="2" y1="12" x2="4" y2="12"/>
      <line x1="20" y1="12" x2="22" y2="12"/>
      <line x1="4.93" y1="19.07" x2="6.34" y2="17.66"/>
      <line x1="17.66" y1="6.34" x2="19.07" y2="4.93"/>
    </symbol>
    <!-- Moon (Dark Mode) -->
    <symbol id="ic-moon" viewBox="0 0 24 24">
      <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
    </symbol>
    <!-- Clock -->
    <symbol id="ic-clock" viewBox="0 0 24 24">

  <script>
    const MODES_META = [
      { key: "all",       icon: "ic-shuttle", name: "多拍", tip: "默认模式：按局切分全部多拍回合" },
      { key: "condensed", icon: "ic-bolt",    name: "纯享", tip: "剔除死球等待，整场紧凑连播" },
      { key: "vertical",  icon: "ic-phone",   name: "竖屏", tip: "9:16 竖屏短视频裁剪导出" },
      { key: "solo",      icon: "ic-user",    name: "独享", tip: "主角球员出场时段独享集锦" },
      { key: "review",    icon: "ic-target",  name: "复盘", tip: "发球接发一拍定音战术复盘" },
      { key: "showcase",  icon: "ic-star",    name: "高光", tip: "Top 5 超长多拍 + 慢镜重放" },
    ];

    let appState = null;
    let selectedModes = ["all"];
    let selectedSegIdx = 0;
    let activeGameFilter = "all";
    let loadedVideoPath = null;
    let isLoopingSegment = false;
    let dragMode = null;

    const videoEl = document.getElementById("videoPlayer");
    const canvas = document.getElementById("timelineCanvas");
    const ctx = canvas.getContext("2d");

    async function apiGet(url) {
      const r = await fetch(url);
      return await r.json();
    }

    async function apiPost(url, payload = {}) {
      const r = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      return await r.json();
    }

    function fmtSec(sec) {
      sec = Math.max(0, Number(sec) || 0);
      const m = Math.floor(sec / 60);
      const s = sec - m * 60;
      return `${String(m).padStart(2, "0")}:${s.toFixed(1).padStart(4, "0")}`;
    }

    function shortFileName(name) {
      return name.replace(/\.(mp4|mov|mkv|ts)$/i, "").replace(/^VID_(\d{8})_(\d{4})\d*/, "$1_$2");
    }

    function renderAll(state, preserveSelection = true) {
      appState = state;

      // Theme & Flat Sun/Moon Icon
      const theme = state.theme_mode === "light" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", theme);
      document.getElementById("themeIconUse").innerHTML =
        `<use href="#${theme === 'dark' ? 'ic-sun' : 'ic-moon'}"/>`;
      document.getElementById("hwInfoText").textContent = `${state.hw_encoder} · v${state.version}`;

      // Videos list
      const vList = document.getElementById("videoList");
      vList.innerHTML = "";
      (state.videos || []).forEach((v) => {
        const div = document.createElement("div");
        div.className = "video-item" + (v.path === state.current_vpath ? " active" : "");
        div.title = v.path;
        div.onclick = () => selectVideo(v.path);
        div.innerHTML = `
          <div class="video-item-left">
            <svg class="flat-icon sm"><use href="#ic-video"/></svg>
            <span class="video-title mono">${shortFileName(v.name)}</span>
          </div>
          <span class="video-cnt mono">${v.cached ? v.rally_count : "—"}</span>
        `;
        vList.appendChild(div);
      });

      // 3x2 Flat Icon Mode Tiles
      const mGrid = document.getElementById("modeGrid");
      mGrid.innerHTML = "";
      MODES_META.forEach((m) => {
        const selected = selectedModes.includes(m.key);
        const btn = document.createElement("button");
        btn.className = "mode-tile" + (selected ? " selected" : "");
        btn.title = m.tip;
        btn.onclick = () => toggleModePill(m.key);
        btn.innerHTML = `
          <svg class="flat-icon lg"><use href="#${m.icon}"/></svg>
          <span>${m.name}</span>
        `;
        mGrid.appendChild(btn);
      });

      if (document.activeElement !== document.getElementById("outDirInput")) {
        document.getElementById("outDirInput").value = state.output_dir || "";
      }

      // Progress & Export Button
      const job = state.job || {};
      const pWrap = document.getElementById("progressWrap");
      const mainBtn = document.getElementById("mainExportBtn");
      if (job.is_running) {
        pWrap.classList.add("visible");
        const pct = Math.round(job.progress || 0);
        document.getElementById("progressFill").style.width = `${pct}%`;
        document.getElementById("exportBtnIcon").innerHTML = `<use href="#ic-stop"/>`;
        document.getElementById("exportBtnLabel").textContent = `${pct}%`;
        mainBtn.onclick = () => apiPost("/api/stop_job").then(s => renderAll(s, true));
      } else {
        pWrap.classList.remove("visible");
        document.getElementById("exportBtnIcon").innerHTML = `<use href="#ic-export"/>`;
        document.getElementById("exportBtnLabel").textContent = "导出";
        mainBtn.onclick = () => startJob("one_click");
      }

      // Timeline & Segments
      const tl = state.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) {
        document.getElementById("topCountVal").textContent = "0";
        document.getElementById("topDurVal").textContent = "00:00";
        document.getElementById("chipsGrid").innerHTML = "";
        drawTimeline();
        return;
      }

      if (!preserveSelection || selectedSegIdx >= tl.segments.length) {
        selectedSegIdx = 0;
      }

      const enabledSegs = tl.segments.filter(s => s.enabled);
      const totalKeptDur = enabledSegs.reduce((a, b) => a + (b.e_cut - b.s_cut), 0);
      document.getElementById("topCountVal").textContent = `${enabledSegs.length}/${tl.segments.length}`;
      document.getElementById("topDurVal").textContent = fmtSec(totalKeptDur);

      if (loadedVideoPath !== tl.video_path) {
        loadedVideoPath = tl.video_path;
        videoEl.src = `/api/video?path=${encodeURIComponent(tl.video_path)}`;
        const seg0 = tl.segments[selectedSegIdx];
        if (seg0) videoEl.currentTime = seg0.s_cut;
      }

      renderGameFilters(tl);
      renderChipsGrid(tl);
      updateSelectedSegmentUI();
      drawTimeline();
    }

    function renderGameFilters(tl) {
      const bar = document.getElementById("gameFilterBar");
      const segs = tl.segments || [];
      const games = {};
      segs.forEach(s => {
        const g = s.game_idx || 1;
        games[g] = (games[g] || 0) + 1;
      });
      const longCount = segs.filter(s => (s.e_cut - s.s_cut) >= 15.0).length;

      const items = [{ id: "all", icon: "ic-shuttle", label: `${segs.length}` }];
      Object.keys(games).sort((a, b) => Number(a) - Number(b)).forEach(g => {
        items.push({ id: `g${g}`, icon: "ic-video", label: `G${g} · ${games[g]}` });
      });
      items.push({ id: "long15", icon: "ic-star", label: `15s+ · ${longCount}` });

      bar.innerHTML = "";
      items.forEach(it => {
        const b = document.createElement("button");
        b.className = "filter-pill mono" + (activeGameFilter === it.id ? " active" : "");
        b.innerHTML = `<svg class="flat-icon sm"><use href="#${it.icon}"/></svg><span>${it.label}</span>`;
        b.onclick = () => {
          activeGameFilter = it.id;
          renderGameFilters(tl);
          renderChipsGrid(tl);
          drawTimeline();
        };
        bar.appendChild(b);
      });
    }

    function passesFilter(seg) {
      if (activeGameFilter === "all") return true;
      if (activeGameFilter === "long15") return (seg.e_cut - seg.s_cut) >= 15.0;
      if (activeGameFilter.startsWith("g")) {
        return (seg.game_idx || 1) === Number(activeGameFilter.slice(1));
      }
      return true;
    }

    function renderChipsGrid(tl) {
      const grid = document.getElementById("chipsGrid");
      grid.innerHTML = "";
      (tl.segments || []).forEach((s, idx) => {
        if (!passesFilter(s)) return;
        const chip = document.createElement("div");
        chip.className = "rally-chip mono" +
          (idx === selectedSegIdx ? " selected" : "") +
          (!s.enabled ? " skipped" : "");
        const dur = Math.round(s.e_cut - s.s_cut);
        chip.title = `G${s.game_idx || 1} #${String(s.uid).padStart(2, "0")} | ${fmtSec(s.s_cut)} – ${fmtSec(s.e_cut)}（双击切换保留/跳过）`;
        chip.onclick = () => selectSegment(idx, true);
        chip.ondblclick = (e) => {
          e.stopPropagation();
          toggleSegmentAtIndex(idx);
        };
        chip.innerHTML = `
          <span class="chip-id">#${String(s.uid).padStart(2, "0")}</span>
          <span class="chip-dur">${dur}s</span>
          <span class="chip-dot" onclick="event.stopPropagation(); toggleSegmentAtIndex(${idx})" title="点击切换保留/跳过"></span>
        `;
        grid.appendChild(chip);
      });
    }

    function updateSelectedSegmentUI() {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const dur = (seg.e_cut - seg.s_cut).toFixed(1);

      videoEl.poster = `/api/frame?path=${encodeURIComponent(tl.video_path)}&t=${(seg.s_cut + 0.5).toFixed(2)}`;

      document.getElementById("curRallyId").textContent = `#${String(seg.uid).padStart(2, "0")}`;
      document.getElementById("curRallyRange").textContent = `${fmtSec(seg.s_cut)} – ${fmtSec(seg.e_cut)}`;
      document.getElementById("curRallyDur").textContent = `${dur}s`;

      const keepBtn = document.getElementById("keepToggleBtn");
      keepBtn.className = "icon-btn sm " + (seg.enabled ? "active-keep" : "skipped-keep");
    }

    function selectSegment(idx, autoPlay = true) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || idx < 0 || idx >= tl.segments.length) return;
      selectedSegIdx = idx;
      const seg = tl.segments[idx];
      updateSelectedSegmentUI();
      renderChipsGrid(tl);
      drawTimeline();

      const selChip = document.querySelector("#chipsGrid .rally-chip.selected");
      if (selChip) selChip.scrollIntoView({ block: "nearest" });

      videoEl.currentTime = seg.s_cut;
      if (autoPlay) {
        isLoopingSegment = true;
        videoEl.play().catch(() => {});
      }
    }

    function stepSegment(delta) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments) return;
      const next = Math.max(0, Math.min(tl.segments.length - 1, selectedSegIdx + delta));
      selectSegment(next, true);
    }

    function playSelectedSegment() {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      if (!videoEl.paused) {
        videoEl.pause();
        return;
      }
      if (videoEl.currentTime < seg.s_cut || videoEl.currentTime >= seg.e_cut - 0.15) {
        videoEl.currentTime = seg.s_cut;
      }
      isLoopingSegment = true;
      videoEl.play().catch(() => {});
    }

    videoEl.addEventListener("play", () => {
      document.getElementById("playIconSvg").innerHTML = `<use href="#ic-pause"/>`;
    });

    videoEl.addEventListener("pause", () => {
      document.getElementById("playIconSvg").innerHTML = `<use href="#ic-play"/>`;
    });

    videoEl.addEventListener("timeupdate", () => {
      const tl = appState?.timeline;
      if (tl && tl.segments && tl.segments[selectedSegIdx] && isLoopingSegment) {
        const seg = tl.segments[selectedSegIdx];
        if (videoEl.currentTime >= seg.e_cut) {
          videoEl.pause();
          isLoopingSegment = false;
        }
      }
      drawTimeline();
    });

    // ==========================================================================
    // Interactive Timeline Canvas
    // ==========================================================================
    function drawTimeline() {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      if (rect.width <= 0) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.save();
      ctx.scale(dpr, dpr);

      const W = rect.width;
      const H = rect.height;
      const isDark = document.documentElement.getAttribute("data-theme") === "dark";

      ctx.fillStyle = isDark ? "#111114" : "#e8e8ec";
      ctx.beginPath();
      ctx.roundRect(0, 0, W, H, 5);
      ctx.fill();

      const tl = appState?.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) {
        ctx.restore();
        return;
      }

      const dur = Math.max(tl.duration || 1, 1);
      const padX = 6;
      const trackW = W - padX * 2;

      tl.segments.forEach((s, i) => {
        const x1 = padX + (s.s_cut / dur) * trackW;
        const x2 = Math.max(x1 + 2.5, padX + (s.e_cut / dur) * trackW);
        const inFilter = passesFilter(s);

        if (i === selectedSegIdx) {
          ctx.fillStyle = "#f59e0b";
        } else if (!s.enabled) {
          ctx.fillStyle = isDark ? "#27272a" : "#d4d4d8";
        } else {
          ctx.fillStyle = inFilter ? "#10a37f" : "rgba(16,163,127,0.25)";
        }

        const y = i === selectedSegIdx ? 3 : 6;
        const h = i === selectedSegIdx ? H - 6 : H - 12;
        ctx.beginPath();
        ctx.roundRect(x1, y, x2 - x1, h, 2.5);
        ctx.fill();
      });

      const curT = videoEl.currentTime || 0;
      const px = padX + (curT / dur) * trackW;
      ctx.strokeStyle = "#ef4444";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(px, 2);
      ctx.lineTo(px, H - 2);
      ctx.stroke();

      ctx.restore();
    }

    window.addEventListener("resize", drawTimeline);

    canvas.addEventListener("mousedown", (e) => {
      const tl = appState?.timeline;
      if (!tl || !tl.segments || tl.segments.length === 0) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const padX = 6;
      const trackW = rect.width - padX * 2;
      const dur = Math.max(tl.duration || 1, 1);

      const sel = tl.segments[selectedSegIdx];
      if (sel) {
        const sx1 = padX + (sel.s_cut / dur) * trackW;
        const sx2 = padX + (sel.e_cut / dur) * trackW;
        if (Math.abs(mx - sx1) <= 6) { dragMode = "start"; return; }
        if (Math.abs(mx - sx2) <= 6) { dragMode = "end"; return; }
      }

      for (let i = 0; i < tl.segments.length; i++) {
        const s = tl.segments[i];
        const x1 = padX + (s.s_cut / dur) * trackW;
        const x2 = Math.max(x1 + 3, padX + (s.e_cut / dur) * trackW);
        if (mx >= x1 - 2 && mx <= x2 + 2) {
          selectSegment(i, true);
          return;
        }
      }

      const clickT = Math.max(0, Math.min(dur, ((mx - padX) / trackW) * dur));
      videoEl.currentTime = clickT;
      drawTimeline();
    });

    window.addEventListener("mousemove", (e) => {
      if (!dragMode) return;
      const tl = appState?.timeline;
      if (!tl) return;
      const rect = canvas.getBoundingClientRect();
      const mx = e.clientX - rect.left;
      const padX = 6;
      const trackW = rect.width - padX * 2;
      const dur = Math.max(tl.duration || 1, 1);
      const t = Math.max(0, Math.min(dur, ((mx - padX) / trackW) * dur));
      const seg = tl.segments[selectedSegIdx];
      if (dragMode === "start" && t < seg.e_cut - 1.0) {
        seg.s_cut = Math.round(t * 10) / 10;
        videoEl.currentTime = seg.s_cut;
      } else if (dragMode === "end" && t > seg.s_cut + 1.0) {
        seg.e_cut = Math.round(t * 10) / 10;
        videoEl.currentTime = seg.e_cut;
      }
      updateSelectedSegmentUI();
      drawTimeline();
    });

    window.addEventListener("mouseup", async () => {
      if (!dragMode) return;
      dragMode = null;
      const tl = appState?.timeline;
      if (tl && tl.segments[selectedSegIdx]) {
        const seg = tl.segments[selectedSegIdx];
        const st = await apiPost("/api/update_segment", {
          uid: seg.uid,
          action: "set_time",
          s_cut: seg.s_cut,
          e_cut: seg.e_cut,
        });
        renderAll(st, true);
      }
    });

    // ==========================================================================
    // API Actions
    // ==========================================================================
    async function selectVideo(path) {
      const st = await apiPost("/api/select_video", { path });
      renderAll(st, false);
    }

    async function browseNative(kind) {
      const st = await apiPost("/api/browse", { kind });
      renderAll(st, true);
    }

    function toggleModePill(key) {
      const cur = new Set(selectedModes);
      if (cur.has(key)) {
        if (cur.size > 1) cur.delete(key);
      } else {
        cur.add(key);
      }
      selectedModes = Array.from(cur);
      renderAll(appState, true);
    }

    function resetDefaultMode() {
      selectedModes = ["all"];
      renderAll(appState, true);
    }

    function toggleSettings(open) {
      document.getElementById("settingsModal").classList.toggle("open", open);
    }

    function onSliderInput() {
      document.getElementById("valMinHits").textContent = `${document.getElementById("slMinHits").value}`;
      document.getElementById("valMinDur").textContent = `${Number(document.getElementById("slMinDur").value).toFixed(1)}s`;
      document.getElementById("valRestGap").textContent = `${Number(document.getElementById("slRestGap").value).toFixed(0)}s`;
      document.getElementById("valMinGameRallies").textContent = `${document.getElementById("slMinGameRallies").value}`;
    }

    async function savePrefsFromUI() {
      const st = await apiPost("/api/save_prefs", {
        output_dir: document.getElementById("outDirInput").value,
      });
      renderAll(st, true);
    }

    function resetSliders() {
      document.getElementById("slMinHits").value = 5;
      document.getElementById("slMinDur").value = 5.0;
      document.getElementById("slRestGap").value = 22.0;
      document.getElementById("slMinGameRallies").value = 8;
      onSliderInput();
    }

    async function toggleTheme() {
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      drawTimeline();
      const st = await apiPost("/api/save_prefs", { theme_mode: next });
      renderAll(st, true);
    }

    async function nudgeEdge(which, delta) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const st = await apiPost("/api/update_segment", {
        uid: seg.uid,
        action: "adjust_time",
        delta_start: which === "start" ? delta : 0.0,
        delta_end: which === "end" ? delta : 0.0,
      });
      renderAll(st, true);
      const updatedSeg = st.timeline?.segments?.[selectedSegIdx];
      if (updatedSeg) {
        videoEl.currentTime = which === "start" ? updatedSeg.s_cut : Math.max(updatedSeg.s_cut, updatedSeg.e_cut - 0.8);
      }
    }

    async function setEdgeToPlayhead(which) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[selectedSegIdx]) return;
      const seg = tl.segments[selectedSegIdx];
      const cur = videoEl.currentTime || 0;
      let ns = seg.s_cut;
      let ne = seg.e_cut;
      if (which === "start" && cur < ne - 0.8) ns = cur;
      if (which === "end" && cur > ns + 0.8) ne = cur;
      const st = await apiPost("/api/update_segment", {
        uid: seg.uid,
        action: "set_time",
        s_cut: ns,
        e_cut: ne,
      });
      renderAll(st, true);
    }

    async function toggleSelectedSegment() {
      await toggleSegmentAtIndex(selectedSegIdx);
    }

    async function toggleSegmentAtIndex(idx) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments[idx]) return;
      const st = await apiPost("/api/update_segment", {
        uid: tl.segments[idx].uid,
        action: "toggle",
      });
      renderAll(st, true);
    }

    async function batchAction(action) {
      const tl = appState?.timeline;
      if (!tl || !tl.segments) return;
      for (const s of tl.segments) {
        const shouldKeep = action === "enable_all" ? true : (s.e_cut - s.s_cut >= 15.0);
        if (s.enabled !== shouldKeep) {
          await apiPost("/api/update_segment", { uid: s.uid, action: "toggle" });
        }
      }
      const st = await apiGet("/api/state");
      renderAll(st, true);
    }

    async function startJob(kind) {
      const jobType = kind === "scan" ? "force_rescan" : "one_click";
      const st = await apiPost("/api/start_job", {
        job_type: jobType,
        config: {
          output_dir: document.getElementById("outDirInput").value,
          modes: selectedModes,
          min_hits: Number(document.getElementById("slMinHits").value || 5),
          min_duration: Number(document.getElementById("slMinDur").value || 5.0),
          rest_gap: Number(document.getElementById("slRestGap").value || 22.0),
          min_rallies_per_game: Number(document.getElementById("slMinGameRallies").value || 8),
        },
      });
      renderAll(st, true);
    }

    async function openOutputFolder() {
      await apiPost("/api/open_folder", {});
    }

    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.code === "Space") {
        e.preventDefault();
        playSelectedSegment();
      } else if (e.code === "ArrowUp" || e.code === "ArrowLeft") {
        e.preventDefault();
        stepSegment(-1);
      } else if (e.code === "ArrowDown" || e.code === "ArrowRight") {
        e.preventDefault();
        stepSegment(1);
      } else if (e.code === "Backspace" || e.code === "Delete") {
        e.preventDefault();
        toggleSelectedSegment();
      }
    });

    (async function init() {
      resetSliders();
      const st = await apiGet("/api/state");
      renderAll(st, false);
      setInterval(async () => {
        if (appState && appState.job && appState.job.is_running) {
          const updated = await apiGet("/api/state");
          renderAll(updated, true);
        }
      }, 650);
    })();
  </script>
</body>
</html>
